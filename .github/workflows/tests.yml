name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The package supports Laravel 10, 11 and 12, and the differences between
    # them are exactly where this package has broken before: publishesMigrations()
    # exists only on 11+, and Eloquent's enum cast validates the class only on
    # 11+. Local development runs one version, so those are invisible without
    # this matrix.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['10.*', '11.*', '12.*']
        include:
          - laravel: '10.*'
            testbench: '8.*'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      # `composer show` takes one package at a time.
      - name: Report resolved versions
        run: |
          for pkg in laravel/framework orchestra/testbench phpunit/phpunit; do
            composer show "$pkg" | grep -E '^(name|versions)' || true
          done

      - name: Run tests
        run: vendor/bin/phpunit
